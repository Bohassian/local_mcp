# The MCP server and the embedding model it uses.
#   docker compose up -d --build
name: local-mcp

services:
  mcp:
    build: .
    container_name: local-mcp
    restart: unless-stopped
    # The host user, so files the server creates in ./data (sqlite -wal/-shm)
    # stay writable by the host-side ingest scripts.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      MCP_PORT: "3939"
      EMBED_URL: "http://ollama:11434"
      MCP_TOKEN: "${MCP_TOKEN:?set MCP_TOKEN in .env (openssl rand -hex 32)}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
    # Localhost only. To also serve the home network, add
    # docker-compose.lan.yml via COMPOSE_FILE in .env.
    ports:
      - "127.0.0.1:${MCP_PORT:-3939}:3939"
    volumes:
      # Shared with the ingest scripts on the host.
      - ./data:/app/data
    # Serves untrusted clients, so keep it locked down.
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512

  ollama:
    # Pinned 2026-11-06 (0.40.10, released 2026-10-23). Take releases at least 14 days old.
    image: ollama/ollama:0.40.10
    container_name: local-mcp-ollama
    restart: unless-stopped
    # Localhost only: Ollama has no auth, and Docker's published ports bypass
    # ufw. The host-side scripts use this port.
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Per sequence; chunks are at most ~1.5k tokens. Lower = less GPU memory.
      OLLAMA_CONTEXT_LENGTH: "8192"
      # Flash attention enables the q8_0 KV cache (about half the memory).
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    # CPU by default. For a GPU, add docker-compose.nvidia.yml or
    # docker-compose.amd.yml via COMPOSE_FILE in .env.

  # One-shot: pulls the embedding model if it's missing, then exits. Skips the
  # network entirely when it's present.
  ollama-pull:
    image: ollama/ollama:0.40.10
    depends_on: [ollama]
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      # Must match EMBED_MODEL in src/docs/store.ts.
      # Model tags can be republished. docs.db was embedded with digest
      # df5bd2e3c74cd8d069d21dc038f1b359fcdc9458fce1c99bd43c9eb1518ff907
      # (`docker compose exec ollama ollama list` shows ID df5bd2e3c74c). If a
      # fresh pull shows another ID, run `npm run embed-drift` before trusting
      # search, and re-ingest if it has moved.
      EMBED_MODEL: "qwen3-embedding:4b"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if ollama show "$$EMBED_MODEL" >/dev/null 2>&1; then
          echo "Embedding model present: $$EMBED_MODEL"
        else
          echo "Pulling embedding model: $$EMBED_MODEL"
          ollama pull "$$EMBED_MODEL"
        fi
    restart: "no"

volumes:
  ollama-models:
